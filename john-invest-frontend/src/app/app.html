<div class="container p-fluid">
  <h1 class="text-white">Calculadora de Juros Compostos</h1>

  <form (ngSubmit)="calcular()">
    <label>Valor Inicial:</label>
    <p-inputNumber [(ngModel)]="valorInicial" name="valorInicial" inputId="valorInicial"
                   mode="currency" currency="BRL" locale="pt-BR" required></p-inputNumber>

    <label>Aporte Mensal:</label>
    <p-inputNumber [(ngModel)]="aporteMensal" name="aporteMensal" inputId="aporteMensal"
                   mode="currency" currency="BRL" locale="pt-BR" required></p-inputNumber>

    <label>Taxa de Juros (%):</label>
    <p-inputNumber [(ngModel)]="taxaJuros" name="taxaJuros" inputId="taxaJuros"
                   suffix="%" [minFractionDigits]="2" [maxFractionDigits]="2" required></p-inputNumber>

    <label>Periodicidade:</label>
    <div class="p-formgroup-inline p-mb-3">
      <p-radioButton name="periodicidade" value="mensal" [(ngModel)]="periodicidade" inputId="mensal" label="Mensal"></p-radioButton>
      <p-radioButton name="periodicidade" value="anual" [(ngModel)]="periodicidade" inputId="anual" label="Anual" class="ml-3"></p-radioButton>
    </div>

    <label>{{ periodicidade === 'mensal' ? 'Meses' : 'Anos' }}</label>
    <p-inputNumber [(ngModel)]="tempo" name="tempo" inputId="tempo" [showButtons]="true" [min]="1" required></p-inputNumber>

    <p-button type="submit" label="Calcular" icon="pi pi-check" class="p-mt-3 p-button-warning"></p-button>
  </form>

  @if (resultados.length > 0) {
    <div class="p-mt-4">
      <h2 class="text-white">Resultado</h2>
      <p-table [value]="resultados">
        <ng-template pTemplate="header">
          <tr>
            <th>Período</th>
            <th>Valor Final</th>
            <th>Juros Mensal</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-r>
          <tr>
            <td>{{ r.periodo }}</td>
            <td>R$ {{ r.valorFinal | number:'1.2-2' }}</td>
            <td>R$ {{ r.valorJuros | number:'1.2-2' }}</td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  }
</div>
